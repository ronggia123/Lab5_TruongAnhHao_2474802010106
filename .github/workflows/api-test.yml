name: GoRest API CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API Tests with Newman & DDT
        env:
          TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run "2474802010106_TruongAnhHao_GoRest.postman_collection.json" \
            -e "2474802010106_TruongAnhHao_GoRest_Env.postman_environment.json" \
            -d users.csv \
            --env-var "token=$TOKEN" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoRest-API-Test-Report
          path: report.html
          if-no-files-found: ignore
